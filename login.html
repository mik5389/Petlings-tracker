<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petlings Admin Login</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#fff5fa;color:#503445;max-width:520px;margin:65px auto;padding:20px}article{background:white;border:1px solid #f4c4dc;border-radius:18px;padding:25px}button{background:#d94f91;color:white;border:0;border-radius:12px;padding:15px 20px;font-weight:700;font-size:16px;width:100%}p{line-height:1.5}small{color:#805f72}a{color:#b73575}</style></head><body><article><h1>🐾 Petlings Admin Login</h1><p id="status">Checking sign-in status…</p><button id="login" hidden>Sign in with GitHub</button><button id="logout" hidden>Sign out</button><p><small>This page only tests your Supabase sign-in. It does not grant editing privileges or change your recipes.</small></p><p><a href="./">Back to Petlings Tracker</a></p></article><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://cgsqwrptzxtvjdhogtzk.supabase.co','sb_publishable_k92vjnQMPWHgMsNr_6k5jw_-Jff4m8X');
const status=document.getElementById('status'),login=document.getElementById('login'),logout=document.getElementById('logout');
async function refresh(){try{const {data,error}=await db.auth.getUser();if(error && error.name!=='AuthSessionMissingError')throw error;const user=data?.user;status.textContent=user?'Signed in successfully! Your account is now registered in this Supabase project.':'Not signed in yet.';login.hidden=!!user;logout.hidden=!user;}catch(e){status.textContent='Sign-in check failed: '+e.message;login.hidden=false;}}
login.onclick=async()=>{login.disabled=true;status.textContent='Opening GitHub…';const {error}=await db.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.origin+location.pathname}});if(error){status.textContent=error.message;login.disabled=false;}};
logout.onclick=async()=>{await db.auth.signOut();refresh()};
refresh();
</script></body></html>
